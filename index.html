<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1b1e23" />
    <!-- GitHub Pages sirve estático puro, sin poder fijar headers HTTP reales — CSP y
         Referrer-Policy van por <meta> porque es lo único que este despliegue puede controlar
         por su cuenta. X-Frame-Options/HSTS no existen como <meta> (requieren un header real);
         quedan documentados en DEPLOYMENT.md como pendientes de una capa como Cloudflare
         delante de GitHub Pages. style-src necesita 'unsafe-inline' por los estilos inline
         dinámicos de components/charts.tsx (barras del panel de Analytics) — script-src NO lo
         necesita: el build de Vite no emite scripts inline, todo sale a archivos con hash. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://usoinmobiliario-whatsapp-bot.onrender.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Panel administrativo — Uso Inmobiliario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
